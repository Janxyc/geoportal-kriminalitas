
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Geoportal Pengaduan Kriminalitas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>
<h2>Geoportal Pengaduan Kriminalitas</h2>
<a href="dashboard.html" class="dashboardBtn">Dashboard</a>
</header>

<div id="map"></div>

<div class="form-panel">
<h3>Laporkan Kejadian</h3>

<form id="reportForm">

<label>Nama Pelapor</label>
<input type="text" id="nama" required>

<label>No HP</label>
<input type="text" id="hp">

<label>Keterangan Kejadian</label>
<textarea id="ket"></textarea>

<label>Foto Pendukung (Opsional)</label>
<input type="file" id="foto">

<input type="hidden" id="lat">
<input type="hidden" id="lng">

<button type="submit">Kirim Laporan</button>

</form>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/map.js"></script>

</body>
</html>
